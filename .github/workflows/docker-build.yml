name: Docker Build and Push

on:
  push:
    branches: [main, frontend-rewrite]
    tags: [ "v*" ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'requirements*.txt'
      - 'app/**'
      - 'main.py'
      - 'frontend/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'requirements*.txt'
      - 'app/**'
      - 'main.py'
      - 'frontend/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: streamcap-backend:ci
          cache-from: type=gha,scope=backend-${{ github.ref }}
          cache-to: type=gha,scope=backend-${{ github.ref }},mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: streamcap-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:6007
          cache-from: type=gha,scope=frontend-${{ github.ref }}
          cache-to: type=gha,scope=frontend-${{ github.ref }},mode=max

  push:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/streamcap-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/streamcap-backend:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/streamcap-backend:${{ github.ref_name }}
          cache-from: type=gha,scope=backend-${{ github.ref }}
          cache-to: type=gha,scope=backend-${{ github.ref }},mode=max

      - name: Push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/streamcap-frontend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/streamcap-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/streamcap-frontend:${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:6007
          cache-from: type=gha,scope=frontend-${{ github.ref }}
          cache-to: type=gha,scope=frontend-${{ github.ref }},mode=max
