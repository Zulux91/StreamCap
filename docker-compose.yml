
services:
  backend:
    image: ${BACKEND_IMAGE:-zulux91/streamcap-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    tty: true
    ports:
      - "${PORT:-6006}:${PORT:-6006}"
      - "${API_PORT:-6007}:${API_PORT:-6007}"
    environment:
      - PORT=${PORT:-6006}
      - API_PORT=${API_PORT:-6007}
      - STREAMCAP_CORS_ORIGINS=${STREAMCAP_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./downloads:/app/downloads
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${API_PORT:-6007}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - streamcap-network

  frontend:
    image: ${FRONTEND_IMAGE:-zulux91/streamcap-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:6007}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:6007}
    depends_on:
      backend:
        condition: service_started
    networks:
      - streamcap-network

networks:
  streamcap-network:
    driver: bridge
